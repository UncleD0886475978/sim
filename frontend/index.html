<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sim</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #6c8cff;
    --user-bubble: #1f2430;
    --assistant-bubble: #12151b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  #sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
  }
  #sidebar h1 {
    font-size: 18px;
    margin: 8px 8px 16px;
    color: var(--accent);
  }
  #new-chat {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #conversations { overflow-y: auto; flex: 1; }
  .conv-item {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item:hover, .conv-item.active { background: #1f2430; color: var(--text); }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
  #input-area {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    resize: none;
    font-size: 14px;
    font-family: inherit;
  }
  #send {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 20px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  code { background: #1f2430; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .nav-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .nav-tab {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .nav-tab.active { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
  #maya-view { display: none; flex: 1; flex-direction: column; padding: 24px; overflow-y: auto; }
  #maya-view h2 { color: var(--accent); margin-top: 0; }
  #maya-view label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); }
  #maya-view textarea, #maya-view input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
  }
  #maya-view textarea { min-height: 160px; resize: vertical; }
  #maya-generate {
    margin-top: 16px;
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }
  #maya-generate:disabled { opacity: 0.5; cursor: not-allowed; }
  #maya-result {
    margin-top: 20px;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.6;
    display: none;
  }
  #maya-copy {
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Sim</h1>
    <div class="nav-tabs">
      <button class="nav-tab active" id="tab-chat">Chat</button>
      <button class="nav-tab" id="tab-maya">Maya</button>
    </div>
    <button id="new-chat">+ New chat</button>
    <div id="conversations"></div>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="Message Sim..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
  <div id="maya-view">
    <h2>Maya — Cover Letter Assistant</h2>
    <p style="color: var(--muted); font-size: 14px;">Paste a job posting below. Maya drafts a cover letter tailored to Simeon's resume.</p>
    <label for="maya-company">Company name (optional)</label>
    <input id="maya-company" type="text" placeholder="e.g. Microsoft" />
    <label for="maya-posting">Job posting</label>
    <textarea id="maya-posting" placeholder="Paste the full job posting here..."></textarea>
    <button id="maya-generate">Generate cover letter</button>
    <div id="maya-result"></div>
    <button id="maya-copy">Copy to clipboard</button>
  </div>

<script>
const API = "http://localhost:8000";
let currentConversationId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const convListEl = document.getElementById("conversations");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function loadConversations() {
  const res = await fetch(`${API}/api/conversations`);
  const convs = await res.json();
  convListEl.innerHTML = "";
  convs.forEach(c => {
    const item = document.createElement("div");
    item.className = "conv-item" + (c.id === currentConversationId ? " active" : "");
    item.textContent = c.title;
    item.onclick = () => openConversation(c.id);
    convListEl.appendChild(item);
  });
}

async function openConversation(id) {
  currentConversationId = id;
  messagesEl.innerHTML = "";
  const res = await fetch(`${API}/api/conversations/${id}/messages`);
  const msgs = await res.json();
  msgs.forEach(m => addMessage(m.role, m.content));
  loadConversations();
}

document.getElementById("new-chat").onclick = () => {
  currentConversationId = null;
  messagesEl.innerHTML = "";
  loadConversations();
};

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;

  addMessage("user", text);
  const assistantDiv = addMessage("assistant", "Thinking...");

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: currentConversationId, content: text }),
    });

    if (!res.ok) {
      assistantDiv.textContent = `Error: ${res.status} ${res.statusText}`;
      sendBtn.disabled = false;
      return;
    }

    const data = await res.json();
    currentConversationId = data.conversation_id;
    assistantDiv.textContent = data.content;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    loadConversations();
  } catch (err) {
    assistantDiv.textContent = "Error: " + err.message;
  }

  sendBtn.disabled = false;
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadConversations();

// ---- Tab switching ----
const tabChat = document.getElementById("tab-chat");
const tabMaya = document.getElementById("tab-maya");
const mainView = document.getElementById("main");
const mayaView = document.getElementById("maya-view");
const sidebarNewChat = document.getElementById("new-chat");
const sidebarConvList = document.getElementById("conversations");

tabChat.onclick = () => {
  tabChat.classList.add("active");
  tabMaya.classList.remove("active");
  mainView.style.display = "flex";
  mayaView.style.display = "none";
  sidebarNewChat.style.display = "block";
  sidebarConvList.style.display = "block";
};

tabMaya.onclick = () => {
  tabMaya.classList.add("active");
  tabChat.classList.remove("active");
  mainView.style.display = "none";
  mayaView.style.display = "flex";
  sidebarNewChat.style.display = "none";
  sidebarConvList.style.display = "none";
};

// ---- Maya ----
const mayaCompanyEl = document.getElementById("maya-company");
const mayaPostingEl = document.getElementById("maya-posting");
const mayaGenerateBtn = document.getElementById("maya-generate");
const mayaResultEl = document.getElementById("maya-result");
const mayaCopyBtn = document.getElementById("maya-copy");

mayaGenerateBtn.onclick = async () => {
  const posting = mayaPostingEl.value.trim();
  if (!posting) return;

  mayaGenerateBtn.disabled = true;
  mayaGenerateBtn.textContent = "Generating...";
  mayaResultEl.style.display = "none";
  mayaCopyBtn.style.display = "none";

  try {
    const res = await fetch(`${API}/api/maya/cover-letter`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        job_posting: posting,
        company_name: mayaCompanyEl.value.trim() || null,
      }),
    });

    if (!res.ok) {
      mayaResultEl.textContent = `Error: ${res.status} ${res.statusText}`;
      mayaResultEl.style.display = "block";
      return;
    }

    const data = await res.json();
    mayaResultEl.textContent = data.cover_letter;
    mayaResultEl.style.display = "block";
    mayaCopyBtn.style.display = "inline-block";
  } catch (err) {
    mayaResultEl.textContent = "Error: " + err.message;
    mayaResultEl.style.display = "block";
  }

  mayaGenerateBtn.disabled = false;
  mayaGenerateBtn.textContent = "Generate cover letter";
};

mayaCopyBtn.onclick = () => {
  navigator.clipboard.writeText(mayaResultEl.textContent);
  mayaCopyBtn.textContent = "Copied!";
  setTimeout(() => (mayaCopyBtn.textContent = "Copy to clipboard"), 1500);
};
</script>
</body>
</html>
