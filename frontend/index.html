<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sim</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #6c8cff;
    --user-bubble: #1f2430;
    --assistant-bubble: #12151b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  #sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
  }
  #sidebar h1 {
    font-size: 18px;
    margin: 8px 8px 16px;
    color: var(--accent);
  }
  #new-chat {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #conversations { overflow-y: auto; flex: 1; }
  .conv-item {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item:hover, .conv-item.active { background: #1f2430; color: var(--text); }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
  #input-area {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    resize: none;
    font-size: 14px;
    font-family: inherit;
  }
  #send {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 20px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  code { background: #1f2430; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Sim</h1>
    <button id="new-chat">+ New chat</button>
    <div id="conversations"></div>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="Message Sim..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>

<script>
const API = "http://localhost:8000";
let currentConversationId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const convListEl = document.getElementById("conversations");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function loadConversations() {
  const res = await fetch(`${API}/api/conversations`);
  const convs = await res.json();
  convListEl.innerHTML = "";
  convs.forEach(c => {
    const item = document.createElement("div");
    item.className = "conv-item" + (c.id === currentConversationId ? " active" : "");
    item.textContent = c.title;
    item.onclick = () => openConversation(c.id);
    convListEl.appendChild(item);
  });
}

async function openConversation(id) {
  currentConversationId = id;
  messagesEl.innerHTML = "";
  const res = await fetch(`${API}/api/conversations/${id}/messages`);
  const msgs = await res.json();
  msgs.forEach(m => addMessage(m.role, m.content));
  loadConversations();
}

document.getElementById("new-chat").onclick = () => {
  currentConversationId = null;
  messagesEl.innerHTML = "";
  loadConversations();
};

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;

  addMessage("user", text);
  const assistantDiv = addMessage("assistant", "Thinking...");

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: currentConversationId, content: text }),
    });

    if (!res.ok) {
      assistantDiv.textContent = `Error: ${res.status} ${res.statusText}`;
      sendBtn.disabled = false;
      return;
    }

    const data = await res.json();
    currentConversationId = data.conversation_id;
    assistantDiv.textContent = data.content;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    loadConversations();
  } catch (err) {
    assistantDiv.textContent = "Error: " + err.message;
  }

  sendBtn.disabled = false;
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadConversations();
</script>
</body>
</html>
